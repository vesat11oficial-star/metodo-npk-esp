      ];
      const state = {answers:{},step:0};
      const goalLabels = {flores:'la floración',frutos:'la fructificación',crecimiento:'el crecimiento',recuperacion:'la salud de tus plantas',plagas:'la observación de posibles daños',cosecha:'tu cosecha'};
      function save(){try{sessionStorage.setItem('mjv-quiz',JSON.stringify(state.answers))}catch(e){}}
      function load(){try{const x=sessionStorage.getItem('mjv-quiz');if(x)state.answers=JSON.parse(x)}catch(e){}}
      function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
      function intro(){root.innerHTML=`<section class="quiz-landing"><div class="intro-content"><p class="eyebrow">🌱 DESCUBRE EL SECRETO DE UN JARDÍN MÁS SALUDABLE</p><h1>¡CONOCE EL MÉTODO NATURAL PARA TENER PLANTAS <em>MÁS FUERTES</em>, <em>MÁS FLORES</em> Y <em>MEJORES COSECHAS</em>!</h1><p class="landing-subtitle">Descubre qué podría estar faltando en tu jardín con unas preguntas sencillas.</p><figure class="comparison"><img src="../assets/quiz/quiz-hero-comparacion.png" alt="Comparación ilustrativa de una planta con pocas flores y otra planta más saludable"><span class="comparison-label today">HOY</span><span class="comparison-label goal">TU OBJETIVO</span></figure><button class="button" data-start>🌿 DESCUBRIR MI MÉTODO IDEAL</button><p class="fine">✓ Gratis &nbsp; ✓ Solo 2 minutos &nbsp; ✓ Resultado personalizado</p></div></section>`;root.querySelector('[data-start]').onclick=()=>{state.step=0;renderQuestion()}}
      function optionMarkup(q,values){return q.options.map((label,i)=>{const selected=values.includes(q.values?q.values[i]:label);const hasEmoji=/^\p{Extended_Pictographic}/u.test(label);const icon=hasEmoji?label.split(/\s+/)[0]:'•';const copy=hasEmoji?label.replace(/^\S+\s/,''):label;return `<button class="option ${selected?'selected':''}" type="button" data-option="${i}" aria-pressed="${selected}"><span class="icon">${esc(icon)}</span><span class="copy">${esc(copy)}</span></button>`}).join('')}
      function genderQuestion(){const selected=state.answers.gender?.[0]||'';root.innerHTML=`<div class="quiz-wrap"><div class="progress-row"><span>Pregunta 1 de 12</span><span>8% completado</span></div><div class="progress" aria-label="Progreso del cuestionario"><i style="width:8%"></i></div><section class="question-card" aria-live="polite"><p class="eyebrow">MI JARDÍN VIVO</p><h1>¿Cómo te identificas?</h1><p class="hint">Usaremos esta respuesta solo para personalizar el tono de la orientación.</p><div class="gender-options"><button class="gender-card ${selected==='mujer'?'selected':''}" type="button" data-gender="mujer" aria-pressed="${selected==='mujer'}"><span class="check" aria-hidden="true">✓</span><img src="../assets/quiz/quiz-genero-mujer.png" alt="Mujer sonriente en un patio con plantas"><strong>SOY MUJER</strong></button><button class="gender-card ${selected==='hombre'?'selected':''}" type="button" data-gender="hombre" aria-pressed="${selected==='hombre'}"><span class="check" aria-hidden="true">✓</span><img src="../assets/quiz/quiz-genero-hombre.png" alt="Hombre sonriente en un jardín doméstico"><strong>SOY HOMBRE</strong></button></div></section></div>`;let advancing=false;root.querySelectorAll('[data-gender]').forEach(btn=>btn.onclick=()=>{if(advancing)return;advancing=true;state.answers.gender=[btn.dataset.gender];save();root.querySelectorAll('[data-gender]').forEach(x=>{const on=x.dataset.gender===btn.dataset.gender;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',String(on))});setTimeout(()=>{state.step=1;renderQuestion()},180)})}
      function renderQuestion(){
        if(state.step===0){genderQuestion();return}
        const q=questions[state.step]; if(!q){return analysis()}
        if(q.type==='branch'){const key=state.answers.goal||'crecimiento';const b=branchOptions[key];Object.assign(q,{title:b.title,type:'single',options:b.options});}
        const current=state.answers[q.id]||[];const vals=Array.isArray(current)?current:[current];const total=questions.length;const pct=Math.round((state.step/total)*100);
        root.innerHTML=`<div class="quiz-wrap"><div class="progress-row"><span>Pregunta ${state.step+1} de ${total}</span><span>${pct}% completado</span></div><div class="progress" aria-label="Progreso del cuestionario"><i style="width:${Math.max(4,pct)}%"></i></div><section class="question-card" aria-live="polite"><p class="eyebrow">MI JARDÍN VIVO</p><h1>${esc(q.title)}</h1>${q.type==='multi'?'<p class="hint">Puedes elegir más de una opción.</p>':''}<div class="options">${optionMarkup(q,vals)}</div>${q.type==='multi'?'<p class="multi-note">Selecciona las opciones que más se parezcan a tu situación.</p>':''}<div class="actions"><button class="secondary" type="button" data-back ${state.step===0?'disabled':''}>Anterior</button>${q.type==='multi'?'<button class="button" type="button" data-next>Continuar</button>':''}</div></section></div>`;
        let advancing=false;root.querySelectorAll('[data-option]').forEach(btn=>btn.onclick=()=>{if(advancing)return;const i=Number(btn.dataset.option);const val=q.values?q.values[i]:q.options[i];let next=Array.isArray(state.answers[q.id])?[...state.answers[q.id]]:[];if(q.type==='single')next=[val];else if(q.exclusive&&val===q.exclusive)next=[val];else{next=next.filter(x=>x!==q.exclusive);next=next.includes(val)?next.filter(x=>x!==val):[...next,val]}state.answers[q.id]=next;save();if(q.type==='multi'){const isSelected=next.includes(val);btn.classList.toggle('selected',isSelected);btn.setAttribute('aria-pressed',String(isSelected));}else{advancing=true;setTimeout(()=>{state.step++;if(state.step===4||state.step===8)moment(state.step);else renderQuestion()},180)}});
        const nextBtn=root.querySelector('[data-next]'); if(nextBtn) nextBtn.onclick=()=>{if(!state.answers[q.id]||(Array.isArray(state.answers[q.id])&&!state.answers[q.id].length)){const hint=root.querySelector('.multi-note')||document.createElement('p');hint.className='multi-note';hint.textContent='Elige una opción para continuar.';root.querySelector('.options').after(hint);return}state.step++; if(state.step===4||state.step===8)moment(state.step);else renderQuestion()};
        root.querySelector('[data-back]').onclick=()=>{if(state.step>0){state.step--;renderQuestion()}};
      }
      function moment(target){const goal=state.answers.goal?.[0]||'crecimiento';const msg={flores:'🌸 Ya conocemos tu deseo de mejorar la floración.',frutos:'🥑 Ya conocemos tu objetivo con los árboles frutales.',crecimiento:'🌱 Ya conocemos tu objetivo de conseguir plantas más fuertes.',recuperacion:'🌿 Ya conocemos tu preocupación por la salud de tus plantas.',plagas:'🔎 Ya conocemos tu interés por observar posibles daños.',cosecha:'🥬 Ya conocemos tu objetivo para mejorar tu huerto.'}[goal];root.innerHTML=`<section class="moment"><div class="moment-card"><img class="moment-image" src="../assets/images/huerto-apertura.webp" alt="Plantas con flores en un jardín doméstico"><p class="eyebrow">¡VAS MUY BIEN!</p><h1>${msg}</h1><p>Ahora vamos a revisar algunos detalles de tus cuidados actuales.</p><div class="moment-tip"><strong>Una idea clave:</strong> la floración y el crecimiento dependen de varios factores, como la luz, el agua, las raíces y la disponibilidad de nutrientes. El enfoque NPK natural ayuda a observar esos factores antes de decidir qué hacer.</div><button class="button" data-continue>Continuar</button></div></section>`;root.querySelector('[data-continue]').onclick=()=>{state.step=target;renderQuestion()}}
      function analysis(){root.innerHTML=`<section class="moment"><div><div class="plant">🌿</div><p class="eyebrow">¡FALTA POCO PARA TU ORIENTACIÓN!</p><h1>🌿 ESTAMOS PREPARANDO TU ORIENTACIÓN PERSONALIZADA…</h1><p>Organizando tus respuestas sobre el tipo de cultivo, los problemas observados y los objetivos que deseas alcanzar.</p><div class="progress" style="max-width:480px;margin:25px auto"><i style="width:100%"></i></div></div></section>`;setTimeout(result,700)}
      function result(){if(window.fbq)fbq('track','Lead');
        const goal=state.answers.goal?.[0]||'crecimiento';
        const place=state.answers.place?.[0]||'tu espacio de cultivo';
        const plants=Array.isArray(state.answers.plants)?state.answers.plants:[];
        const duration=Array.isArray(state.answers.time)?state.answers.time[0]:(state.answers.time||'');
        const tried=Array.isArray(state.answers.tried)?state.answers.tried:[];
        const availability=Array.isArray(state.answers.availability)?state.answers.availability[0]:(state.answers.availability||'');
        const data={
          flores:{title:'🌸 TU PRIORIDAD ES MEJORAR LA FLORACIÓN.',analysis:'Nos contaste que tus plantas crecen, pero producen pocas flores. Esto puede relacionarse con la luz, la etapa de desarrollo, el riego o el equilibrio nutricional. Comprender estos factores puede ayudarte a crear mejores condiciones para la floración.',today:'Pocas flores',learn:'Comprender qué necesitan',objective:'Mejores condiciones de floración',alert:'Aplicar más fertilizante no siempre produce más flores. Si no comprendes las necesidades de tu planta, puedes seguir gastando dinero sin conseguir el resultado que esperas.',image:'flowers',alt:'Jardín doméstico con flores coloridas'},
          frutos:{title:'🥑 TU PRIORIDAD ES FAVORECER LA FRUCTIFICACIÓN.',analysis:'Nos contaste que tus árboles no están produciendo tantos frutos como esperabas. La nutrición, la polinización, el agua y la etapa de desarrollo pueden influir en este proceso. Aprender a reconocer estos factores es fundamental para mejorar el manejo de tus frutales.',today:'Pocos frutos',learn:'Comprender el desarrollo del árbol',objective:'Mejor manejo de los frutales',alert:'Un árbol puede tener hojas saludables y aun así producir pocos frutos. La nutrición es importante, pero también existen otros factores que necesitas conocer.',image:'fruit',alt:'Árbol frutal doméstico con frutos'},
          crecimiento:{title:'🌱 TU PRIORIDAD ES CONSEGUIR PLANTAS MÁS FUERTES.',analysis:'Tus respuestas indican que buscas mejorar el desarrollo de tus plantas. La iluminación, el drenaje, la salud de las raíces y los nutrientes pueden influir en su crecimiento. Revisar estos elementos es un buen punto de partida.',today:'Crecimiento lento',learn:'Revisar nutrición y cuidados',objective:'Plantas más saludables',alert:'Cuando una planta crece lentamente, añadir cualquier preparación puede no resolver el problema. Primero es importante comprender qué está limitando su desarrollo.',image:'plants',alt:'Plantas verdes y vigorosas en un jardín'},
          recuperacion:{title:'🌿 TU PRIORIDAD ES MEJORAR LA SALUD DE TUS PLANTAS.',analysis:'Sabemos que te preocupa ver hojas amarillas, plantas marchitas o señales de deterioro. Antes de aplicar cualquier producto, es importante revisar el agua, las raíces, la luz y otros factores.',today:'Plantas debilitadas',learn:'Investigar las posibles causas',objective:'Cuidados más adecuados',alert:'Algunas plantas pueden empeorar cuando se continúa regando o fertilizando sin comprender la causa de sus síntomas.',image:'plants',alt:'Plantas verdes y bien cuidadas'},
          plagas:{title:'🔎 TU PRIORIDAD ES IDENTIFICAR QUÉ ESTÁ DAÑANDO TUS PLANTAS.',analysis:'Según tus respuestas, has observado insectos o daños en tus plantas y quieres encontrar una manera de protegerlas. Estos síntomas no siempre tienen la misma causa. Antes de utilizar cualquier preparación, necesitas aprender qué factores observar.',today:'Insectos o daños observados',learn:'Identificar qué está ocurriendo',objective:'Mejor protección del jardín',alert:'Si una planta presenta insectos o manchas, aplicar productos al azar puede ser ineficaz e incluso causar daños. Identificar correctamente el problema es el primer paso.',image:'leaf',alt:'Hojas saludables de un jardín doméstico'},
          cosecha:{title:'🥬 TU PRIORIDAD ES CUIDAR MEJOR TU HUERTO.',analysis:'Tus respuestas muestran que quieres cuidar mejor tu huerto y aprovechar sus diferentes etapas. El suelo, el agua, la luz, la nutrición y la organización del cultivo pueden influir en lo que consigues cosechar.',today:'Cultivo que deseas mejorar',learn:'Organizar los cuidados',objective:'Un huerto mejor cuidado',alert:'Pequeños errores de riego, luz o manejo pueden afectar tus cultivos. Comprender esos factores ayuda a tomar mejores decisiones.',image:'garden',alt:'Huerto doméstico bonito y organizado'}
        }[goal];
        const summary=[place.replace(/^\S+\s/,''),plants.length?plants.map(x=>x.replace(/^\S+\s/,'')).join(', '):'el cultivo que elegiste',duration?duration.replace(/^\S+\s/,''):'hace un tiempo',tried.length?`Ya probaste: ${tried.map(x=>x.replace(/^\S+\s/,'')).join(', ')}`:'Aún estás buscando una forma clara de empezar',availability?availability.replace(/^\S+\s/,''):'a tu ritmo'];
        root.innerHTML=`<section class="result"><div class="result-card"><p class="eyebrow">🌿 TU RESULTADO ESTÁ LISTO</p><h1>${data.title}</h1><div class="analysis-block"><h2>🔎 ESTO ES LO QUE DESCUBRIMOS SOBRE TU JARDÍN</h2><p>${data.analysis}</p></div><div class="answer-summary"><h2>Tu punto de partida</h2><ul><li><strong>Espacio:</strong> ${esc(summary[0])}</li><li><strong>Qué cultivas:</strong> ${esc(summary[1])}</li><li><strong>Tiempo con esta dificultad:</strong> ${esc(summary[2])}</li><li><strong>Lo que ya intentaste:</strong> ${esc(summary[3])}</li><li><strong>Tiempo disponible:</strong> ${esc(summary[4])}</li></ul></div><div class="journey"><h2>🌱 TU CAMINO HACIA UN JARDÍN MEJOR CUIDADO</h2><div class="journey-track"><div class="journey-line"></div><div class="journey-step"><span>1</span><strong>HOY</strong><small>${data.today}</small></div><div class="journey-step"><span>2</span><strong>APRENDER</strong><small>${data.learn}</small></div><div class="journey-step"><span>3</span><strong>TU OBJETIVO</strong><small>${data.objective}</small></div></div><p class="journey-note">Esta es una representación de tu camino de aprendizaje, no una predicción garantizada.</p></div><div class="need-block"><h2>⚠️ HAY ALGO IMPORTANTE QUE DEBES SABER</h2><p>${data.alert}</p></div><div class="desire-block"><h2>🌸 IMAGINA LO QUE TE GUSTARÍA CONSEGUIR EN TU JARDÍN</h2><img src="${images[data.image]}" alt="${data.alt}"><p>Ahora imagina tener una guía clara para comprender mejor tus plantas y aprender qué cuidados pueden ayudarte a acercarte a ese objetivo.</p><small>Imagen ilustrativa.</small></div><div class="curiosity-block"><h2>🌿 EXISTE UNA MANERA MÁS SENCILLA DE EMPEZAR A COMPRENDER TUS PLANTAS.</h2><p>Lo que muchas personas necesitan no es comprar otro producto sin saber cómo utilizarlo.</p><p>Es aprender a comprender sus plantas, conocer los nutrientes importantes y descubrir preparaciones explicadas paso a paso.</p><p>Hemos reunido estos conocimientos en un método práctico que podrás conocer a continuación.</p><strong>Y lo mejor es que muchos de los materiales son familiares y fáciles de encontrar.</strong></div><p class="next-step">El siguiente paso es conocer un método organizado para aprender a cuidar mejor tu jardín.</p><a class="button" href="${salesUrl}" data-sales>QUIERO QUE MIS PLANTAS DEN MÁS FLORES Y FRUTOS</a></div></section>`;
      }
      load();intro();
    })();
  </script>
